name: ci

# Runs the pull request's own code with a read-only token and no secrets. The security gate is the separate pr-guard
# workflow, which runs main's copy of itself; these jobs can be trusted on a pull request only while pr-guard is green,
# because a pull request that edits this file is refused there.
#
# Actions are pinned to full commit SHAs (the comment names the release), and no checkout leaves the job's token behind
# for the steps that follow. .github/scripts/workflows.test.mjs keeps it so.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app · lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: Solana SDK and independent economic model
        run: |
          npx tsc --noEmit -p packages/solana-sdk/tsconfig.json
          npx tsx --test packages/solana-sdk/tests/*.test.ts
          node --experimental-strip-types --test ../packages/solana-model/*.test.mjs
      - name: production build
        env:
          NEXT_PUBLIC_SITE_URL: https://openlaunch.lol
          NEXT_PUBLIC_LAUNCH_FACTORY: "0x815542E8b392389A1389E22E588E4B62A67Ade72"
          NEXT_PUBLIC_LAUNCH_LOCKER: "0xcd1680D26922fcd9CabFbb8a56bA40C333fD842a"
          NEXT_PUBLIC_LAUNCH_FACTORY_ROBINHOOD: "0x815542E8b392389A1389E22E588E4B62A67Ade72"
          NEXT_PUBLIC_LAUNCH_LOCKER_ROBINHOOD: "0xcd1680D26922fcd9CabFbb8a56bA40C333fD842a"
        run: npm run build

  solana:
    name: Solana · host tests, SBFv3 build, offline VM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes or fetches with the token; keep it out of .git/config for cargo install and build tools.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - run: cargo fmt --all --check
      - run: cargo test -p launch-pool --locked
      - name: Install pinned build-only SBF tool
        run: cargo install cargo-build-sbf --version 4.2.0 --locked --root .tools
      - name: Build current SBPF format, reject stack diagnostics
        run: bash scripts/check-sbf.sh
      - name: Execute compiled program offline
        run: cargo test --workspace --features svm-tests --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --features svm-tests --locked -- -D warnings
      # No RPC credentials, wallet keys, deployments, or authority operations in CI.

  contracts:
    name: contracts · build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      # the deployed sources, their build settings and the library pins match contracts/deployed.lock byte for byte
      - run: script/check-deployed-sources.sh
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - run: forge build --sizes
      - run: forge test --match-path test/LaunchFactory.t.sol -vv
      - run: forge test --match-path test/LaunchFactory.arcGuard.t.sol -vv
      - run: script/check-arc-factory.sh
      # live-fork suites (FORK_TESTS=true) need RPC access and run locally before a release; see README

  guard:
    name: guard · unit tests
    # same image and preinstalled Node as the pr-guard workflow, so the tests run where the guard runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test .github/scripts/pr-guard.test.mjs .github/scripts/workflows.test.mjs

  deps:
    name: deps · registry signatures + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # every installed package carries a valid npm registry signature
      - run: npm audit signatures
      # known vulnerabilities in what ships to production; a new advisory can turn this red on an unrelated pull request,
      # so it is a signal to act on, not a required check
      - run: npm audit --omit=dev --audit-level=high
