[package]
name = "launch-pool-svm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
svm-tests = []

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["svm-tests"]

[dev-dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token"] }
bincode = "=1.3.3"
# Anchor's legacy dependency shares this permitted five8_core version with
# modern host SDKs. The host-only Error impl must be enabled for keypair parsing.
five8_core = { version = "=0.1.2", features = ["std"] }
launch-pool = { path = "../programs/launch_pool" }
litesvm = "=0.13.1"
solana-account = "=3.4.0"
solana-address = "=2.4.0"
solana-clock = "=3.0.1"
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-sdk-ids = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
