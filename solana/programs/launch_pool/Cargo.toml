[package]
name = "launch-pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "launch_pool"

[features]
# Exclude Anchor's separately managed on-chain IDL instruction surface. The SDK
# and ABI are published with source, not controlled by an IDL authority account.
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
# Anchor's account-init macro references token_2022 helpers even for legacy
# Token account types. No instruction accepts Token-2022 as the program ID.
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
bincode = "=1.3.3"

[dev-dependencies]
serde_json = "=1.0.151"
