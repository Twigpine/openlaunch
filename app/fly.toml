# openlaunch.lol (Fly app still named `basebid`; Postgres `basebid-db`) — free, open-source token launchpad on Base + Robinhood Chain. Deploy from this directory:
#   fly deploy -c fly.toml --ha=false --remote-only \
#     --build-arg NEXT_PUBLIC_LAUNCH_FACTORY=0x... --build-arg NEXT_PUBLIC_LAUNCH_LOCKER=0x... \
#     --build-arg NEXT_PUBLIC_LAUNCH_FACTORY_ROBINHOOD=0x... --build-arg NEXT_PUBLIC_LAUNCH_LOCKER_ROBINHOOD=0x... \
#     --build-arg NEXT_PUBLIC_LAUNCH_FACTORY_ARC=0x... --build-arg NEXT_PUBLIC_LAUNCH_LOCKER_ARC=0x...
# Postgres: attached `basebid-db` (private 6PN; DATABASE_URL injected as a secret).
# Runtime secrets: BASE_RPC_URL, ROBINHOOD_RPC_URL, ARC_RPC_URL, LAUNCH_DEPLOY_BLOCK, LAUNCH_DEPLOY_BLOCK_ROBINHOOD, LAUNCH_DEPLOY_BLOCK_ARC (scripts/fly-secrets.sh).
app = 'basebid'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    NEXT_PUBLIC_CHAIN = 'base'
    NEXT_PUBLIC_SITE_URL = 'https://openlaunch.lol'

[deploy]
  # Apply db/schema.sql (idempotent) before the new version takes traffic.
  release_command = 'node scripts/migrate.mjs'

[env]
  # In-process launchpad indexer (Fly has no cron). Single always-on machine.
  LAUNCH_SYNC_LOOP = '1'
  LAUNCH_SYNC_INTERVAL_MS = '15000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

# Dedicated core: shared-cpu-2x ran above its CPU baseline and got throttled (health checks flapping, 2026-10-01).
[[vm]]
  size = 'performance-1x'
  memory = '2gb'
